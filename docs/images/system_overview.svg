<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">System Overview</text>
  <rect x="40" y="70" width="280" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="180" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Host PC</text>
  <text x="180" y="130" text-anchor="middle" font-family="sans-serif" font-size="13">Robot Framework (RobotTests/)</text>
  <text x="180" y="155" text-anchor="middle" font-family="sans-serif" font-size="13">Peripheral Python libraries</text>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="13">serial_common.py</text>
  <text x="180" y="210" text-anchor="middle" font-family="monospace" font-size="12">/dev/ttyACM0  115200 8N1</text>
  <rect x="440" y="70" width="280" height="160" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">ESP32-S3 Mini</text>
  <text x="580" y="130" text-anchor="middle" font-family="sans-serif" font-size="13">Zephyr firmware (Testbench/)</text>
  <text x="580" y="155" text-anchor="middle" font-family="sans-serif" font-size="13">Zephyr shell (prompt tb:~$)</text>
  <text x="580" y="180" text-anchor="middle" font-family="sans-serif" font-size="13">GPIO / ADC / PWM / SPI handlers</text>
  <text x="580" y="210" text-anchor="middle" font-family="sans-serif" font-size="13">USB Serial/JTAG console</text>
  <line x1="320" y1="140" x2="440" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="180" x2="320" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="135" text-anchor="middle" font-family="sans-serif" font-size="11">commands</text>
  <text x="380" y="200" text-anchor="middle" font-family="sans-serif" font-size="11">replies</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
