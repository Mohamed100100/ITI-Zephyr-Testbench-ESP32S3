<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Connections</text>
  <rect x="40" y="60" width="250" height="150" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="165" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">Host PC</text>
  <text x="165" y="120" text-anchor="middle" font-family="sans-serif" font-size="13">USB port</text>
  <text x="165" y="150" text-anchor="middle" font-family="monospace" font-size="12">/dev/ttyACM0</text>
  <text x="165" y="180" text-anchor="middle" font-family="sans-serif" font-size="12">Robot Framework</text>
  <rect x="470" y="60" width="250" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="595" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">ESP32-S3 Mini</text>
  <text x="595" y="120" text-anchor="middle" font-family="sans-serif" font-size="13">USB-C (Serial/JTAG)</text>
  <text x="595" y="150" text-anchor="middle" font-family="monospace" font-size="12">GPIO19 (D-) / GPIO20 (D+)</text>
  <text x="595" y="180" text-anchor="middle" font-family="sans-serif" font-size="12">Zephyr shell</text>
  <line x1="290" y1="135" x2="470" y2="135" stroke="#333" stroke-width="3"/>
  <text x="380" y="128" text-anchor="middle" font-family="sans-serif" font-size="12">USB-C cable</text>
  <text x="380" y="152" text-anchor="middle" font-family="sans-serif" font-size="11">115200 8N1</text>
  <text x="380" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">GPIO loopback (optional, for readback tests)</text>
  <rect x="210" y="265" width="130" height="40" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="275" y="290" text-anchor="middle" font-family="sans-serif" font-size="13">GPIO7 (out)</text>
  <rect x="430" y="265" width="130" height="40" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="495" y="290" text-anchor="middle" font-family="sans-serif" font-size="13">GPIO8 (in)</text>
  <line x1="340" y1="285" x2="430" y2="285" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/>
    </marker>
  </defs>
</svg>
